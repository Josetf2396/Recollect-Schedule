---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 2.3.7
serverless_language: node
polling_url: 'https://api.recollect.net/api/places/{{ calendar_url | split: "/places/" | last | split: "/" | first }}/services/{{ calendar_url | split: "/services/" | last | split: "/" | first }}/events?nomerge=1&hide=reminder_only&after={{ "now" | date: "%s" | minus: 86400 | date: "%Y-%m-%d" }}&before={{ "now" | date: "%s" | plus: 10368000 | date: "%Y-%m-%d" }}&locale=en'
polling_headers: user-agent=TRMNL-Recollect-Schedule/1.0
polling_body: ''
id: 394530
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  category: life,environment
  description: "Displays your upcoming garbage, recycling, organics, and yard waste collection dates directly on your TRMNL device.\n<br><br>\nCompatible with any municipality served by <strong>Recollect</strong>, the collection-calendar platform used by hundreds of cities across the United States and Canada.\n<br><br>\n<strong>Features:</strong><br>\n\U0001F5D3️ Live data sourced directly from your municipality's Recollect calendar<br>\n♻️ Automatic detection of collection types, labeled using your city's own terminology (Blue Box, Green Bin, Yard Waste, and more)<br>\n\U0001F4F1 Layouts optimized for every TRMNL view size<br>\n⏰ Countdown indicating the number of days until your next collection<br>\n\U0001F4C5 Advance notice of holidays that may affect your collection schedule\n<br><br>\n<strong>Setup:</strong><br>\n1. Visit your city's waste collection calendar page and enter your address<br>\n2. Locate the <em>Subscribe</em> or <em>Add to calendar</em> option and copy the URL (it will end in <code>.ics</code>)<br>\n3. Paste the URL into the Calendar URL field below\n<br><br>\nOnce configured, the plugin automatically reads your location and service details from the link and refreshes on its own.\n<br><br>\n<strong>Note:</strong> This plugin requires your municipality to use Recollect. If your city uses a different provider, no schedule will be available for your address.\n<br><br>\nForked from <a href='https://github.com/hossain-khan/trmnl-next-pickup-plugin' class='underline'>Hossain Khan's Next Pickup Plugin</a>\n"
- keyname: calendar_url
  field_type: string
  name: Calendar URL
  description: The Recollect calendar (.ics) URL for your address — see the setup steps above.
  placeholder: https://api.recollect.net/api/places/EE0C3310-C0C3-11E6-8A10-F4110BA3B673/services/340/events.en-US.ics?client_id=...
- keyname: address
  field_type: string
  name: Display Address
  description: A friendly name for your location to show on the display
  placeholder: 915 I St, Sacramento
  optional: true
name: Recollect Schedule
refresh_interval: 60
