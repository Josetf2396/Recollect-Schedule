---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 2.3.7
serverless_language: ''
polling_url: 'https://api.recollect.net/api/places/{{ calendar_url | split: "/places/" | last | split: "/" | first }}/services/{{ calendar_url | split: "/services/" | last | split: "/" | first }}/events?nomerge=1&hide=reminder_only&after={{ "now" | date: "%Y-%m-%d" }}&before={{ "now" | date: "%s" | plus: 2592000 | date: "%Y-%m-%d" }}&locale=en'
polling_headers: user-agent=TRMNL-Recollect-Schedule/1.0
polling_body: ''
id: 392941
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  category: life,environment
  description: "Shows your next garbage, recycling, organics, and yard waste pickup dates on your TRMNL device.\n<br><br>\nWorks with any city served by <strong>Recollect</strong> — the collection-calendar software used by hundreds of municipalities across the US and Canada.\n<br><br>\n<strong>Features:</strong><br>\n\U0001F5D3️ Live data straight from your city's Recollect calendar<br>\n♻️ Collection types are detected automatically and labelled with your city's own vocabulary (Blue Box, Green Bin, Yard Waste…)<br>\n\U0001F4F1 Optimized layouts for all TRMNL view sizes<br>\n⏰ Countdown showing days until the next pickup<br>\n\U0001F4C5 Upcoming holidays that may shift collection\n<br><br>\n<strong>Setup:</strong><br>\n1. Open your city's waste collection calendar page and look up your address<br>\n2. Find the <em>Subscribe</em> / <em>Add to calendar</em> link and copy its URL (it ends in <code>.ics</code>)<br>\n3. Paste it into the Calendar URL field below\n<br><br>\nThat's it — the plugin reads your location and service directly out of that link and refreshes automatically.\n<br><br>\n<strong>Note:</strong> If your city doesn't use Recollect, this plugin won't find a schedule for your address.\n"
- keyname: calendar_url
  field_type: string
  name: Calendar URL
  description: The <em>Subscribe</em> / <em>Add to calendar</em> link from your city's Recollect collection calendar, after you've looked up your address. Both your location and service ID are read from it.
  placeholder: https://api.recollect.net/api/places/EE0C3310-C0C3-11E6-8A10-F4110BA3B673/services/340/events.en-US.ics?client_id=...
- keyname: address
  field_type: string
  name: Display Address
  description: A friendly name for your location to show on the display
  placeholder: 915 I St, Sacramento
  optional: true
name: Recollect Schedule
refresh_interval: 15
